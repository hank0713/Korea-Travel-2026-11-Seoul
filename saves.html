"}, {"addedAt": "2026-10-27", "author": "@stella4134_", "itemCount": 1, "platform": "Instagram", "postedAt": "2026-08-21", "summary": "首爾獨旅 EP11：3000 刀熟成五花肉＋起司。影片沒寫店名，從招牌辨識為리정원 明洞店。", "title": "首爾獨旅 EP11 熟成五花肉", "trip": "kr-2026-11", "url": "https://www.instagram.com/stella4134_/reel/DcTHR_AurIt/", "id": "ig-stella4134_-DcTHR_AurIt"}, {"addedAt": "2026-10-27", "author": "@amy_koreaguide", "itemCount": 1, "platform": "Instagram", "postedAt": "2026-10-13", "summary": "合井 미필담：米其林必比登的北韓式手工餃子湯，可一人用餐。", "title": "米其林北韓餃子湯 미필담", "trip": "kr-2026-11", "url": "https://www.instagram.com/amy_koreaguide/p/DebwY5SkyTg/", "id": "ig-amy_koreaguide-DebwY5SkyTg"}, {"addedAt": "2026-10-27", "author": "@lnez.sharing", "itemCount": 1, "platform": "Instagram", "postedAt": "2026-10-23", "summary": "首爾 15 間會回訪的餐廳清單（只有店名）。", "title": "首爾 15 間一定會回訪的餐廳", "trip": "kr-2026-11", "url": "https://www.instagram.com/lnez.sharing/p/De1PnWoESu-/", "id": "ig-lnez.sharing-De1PnWoESu-"}, {"addedAt": "2026-10-27", "author": "@emilyhuang84", "itemCount": 1, "platform": "Instagram", "postedAt": "2026-07-29", "summary": "팔팔솔막창 忠武路店：起司、大蔥烤豬腸，不油膩；中文菜單有翻錯。", "title": "팔팔솔막창 忠武路", "trip": "kr-2026-11", "url": "https://www.instagram.com/emilyhuang84/reel/DbX61T1z8A4/", "id": "ig-emilyhuang84-DbX61T1z8A4"}, {"addedAt": "2026-10-27", "author": "@creatrip.tw（Creatrip 官方）", "itemCount": 1, "platform": "Instagram＋網站", "postedAt": "2026-10-26", "summary": "Creatrip 首爾烤肉影片（11 家）與專頁 creatrip.com/spot/theme/476（24 家，含濟州 1 家），可線上付訂金訂位。", "title": "首爾必吃烤肉店清單", "trip": "kr-2026-11", "url": "https://www.instagram.com/creatrip.tw/reel/De9Et8wJLkv/", "id": "ig-creatrip.tw-De9Et8wJLkv"}]}</script>
<script>
const STATUS=["收藏","想去","已排入"];
const FIT={near:"近住宿",on:"順路",far:"要專程"};
const FIT_ORDER={near:0,on:1,far:2};
let trips=[],items=[],sources=[],tripId=null,area="全部",cat="全部",group="area",q="",db=null,canWrite=true;
try{const s=JSON.parse(localStorage.getItem("saves-ui")||"{}");if(s.group)group=s.group;if(s.tripId)tripId=s.tripId}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function saveUI(){try{localStorage.setItem("saves-ui",JSON.stringify({group,tripId}))}catch(e){}}

function render(){
  const trip=trips.find(t=>t.id===tripId)||trips[0];
  if(trip)tripId=trip.id;
  $("trips").innerHTML=trips.map(t=>`<button class="trip" data-id="${esc(t.id)}" aria-pressed="${t.id===tripId}">${esc(t.name)}</button>`).join("");
  $("trips").hidden=trips.length<2;
  if(trip){
    $("h1").textContent=trip.name+" 收藏";
    $("tripline").textContent=[trip.dates,trip.bases].filter(Boolean).join("｜");
    if(trip.note){$("tripnote").innerHTML=trip.note;$("tripnote").hidden=false}else $("tripnote").hidden=true;
  }else{$("tripline").textContent="還沒有收藏。";}
  ["area","cat","day"].forEach(g=>$("g-"+g).setAttribute("aria-pressed",group===g));
  $("g-day").hidden=!(trip&&trip.days&&trip.days.length);

  const mine=items.filter(i=>i.trip===tripId);
  const areaKey=i=>i.area||i.city||"其他";
  const countBy=(arr,f)=>arr.reduce((m,i)=>(m[f(i)]=(m[f(i)]||0)+1,m),{});
  const ac=countBy(mine,areaKey), cc=countBy(mine,i=>i.category||"其他");
  if(area!=="全部"&&!ac[area])area="全部"; if(cat!=="全部"&&!cc[cat])cat="全部";
  const chip=(k,n,sel,kind)=>`<button class="chip" data-kind="${kind}" data-v="${esc(k)}" aria-pressed="${sel===k}">${esc(k)}<span class="n">${n}</span></button>`;
  $("areas").innerHTML=chip("全部",mine.length,area,"area")+Object.keys(ac).sort((a,b)=>ac[b]-ac[a]||a.localeCompare(b,"zh-Hant")).map(k=>chip(k,ac[k],area,"area")).join("");
  $("cats").innerHTML=chip("全部",mine.length,cat,"cat")+Object.keys(cc).map(k=>chip(k,cc[k],cat,"cat")).join("");

  const ql=q.trim().toLowerCase();
  const shown=mine.filter(i=>(area==="全部"||areaKey(i)===area)&&(cat==="全部"||(i.category||"其他")===cat)&&
    (!ql||[i.name,i.nameLocal,i.city,i.area,i.category,i.summary,i.transit,(i.tags||[]).join(" "),i.fit,i.address,(i.verified||[]).join(" ")].join(" ").toLowerCase().includes(ql)));
  $("count").textContent=mine.length?`顯示 ${shown.length} / ${mine.length} 筆`:"";

  if(!mine.length){$("list").innerHTML=`<div class="empty">這趟還沒有收藏。</div>`;}
  else if(!shown.length){$("list").innerHTML=`<div class="empty">沒有符合的收藏。換個關鍵字，或把篩選改回「全部」。</div>`;}
  else{
    const groups=new Map();
    const keyOf=i=>group==="area"?areaKey(i):group==="cat"?(i.category||"其他"):(i.day||"未排定");
    shown.slice().sort((a,b)=>(FIT_ORDER[a.fitLevel]??3)-(FIT_ORDER[b.fitLevel]??3)||(a.order??99)-(b.order??99))
      .forEach(i=>{const k=keyOf(i);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i)});
    let keys=[...groups.keys()];
    if(group==="day"&&trip.days){const o=trip.days;keys.sort((a,b)=>(o.indexOf(a)<0?99:o.indexOf(a))-(o.indexOf(b)<0?99:o.indexOf(b)))}
    else keys.sort((a,b)=>groups.get(b).length-groups.get(a).length||a.localeCompare(b,"zh-Hant"));
    $("list").innerHTML=keys.map(k=>{
      const g=groups.get(k); const city=group==="area"&&g[0].city&&g[0].city!==k?` <small>${esc(g[0].city)}</small>`:"";
      return `<section class="group"><h2>${esc(k)}${city}<small>${g.length} 筆</small></h2><div class="cards">${g.map(card).join("")}</div></section>`}).join("");
  }

  const src=sources.filter(s=>s.trip===tripId);
  $("sources").hidden=!src.length;
  $("srclist").innerHTML=src.map(s=>`<div class="srow"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>
    <div class="m">${esc(s.platform)}・${esc(s.author||"")}・收藏 ${esc(s.addedAt||"")}・${s.itemCount||0} 筆</div>${s.summary?`<div>${esc(s.summary)}</div>`:""}</div>`).join("");
}

function card(i){
  const st=i.status||"收藏";
  const src=sources.find(s=>s.id===i.sourceId);
  const tags=[`<span class="tag cat">${esc(i.category||"其他")}</span>`];
  if(i.fitLevel)tags.push(`<span class="tag ${i.fitLevel}">${FIT[i.fitLevel]}</span>`);
  if(i.inPlan)tags.push(`<span class="tag plan">${esc(i.inPlan)}</span>`);
  (i.tags||[]).forEach(t=>tags.push(`<span class="tag">${esc(t)}</span>`));
  const rows=[["交通",i.transit],["地址",i.address],["時間",i.hours],["價格",i.price]].filter(r=>r[1]);
  const imgs=(i.images||[]).filter(x=>x&&x.url);
  const pic=(x,k,cls)=>`<button class="pic${cls||""}" data-item="${esc(i.id)}" data-k="${k}" aria-label="放大照片：${esc(x.caption||i.name)}"><img src="${esc(x.url)}" alt="${esc(x.caption||i.name)}" loading="lazy"></button>`;
  const pics=imgs.length?`<div class="pics">${pic(imgs[0],0)}${imgs.length>1?`<div class="more">${imgs.slice(1,3).map((x,k)=>pic(x,k+1)).join("")}</div>`:""}${imgs.length>3?`<div class="picn">共 ${imgs.length} 張</div>`:""}</div>`:"";
  const mapUrl=i.map&&i.map.q?"https://map.naver.com/p/search/"+encodeURIComponent(i.map.q):"";
  const isPlace=mapUrl&&!i.map.nearby;
  const nameHtml=isPlace?`<a class="namelink" href="${esc(mapUrl)}" target="_blank" rel="noopener" title="在 NAVER Map 開啟">${esc(i.name)}</a>`:esc(i.name);
  const mapBtn=mapUrl?`<a class="mapbtn" href="${esc(mapUrl)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>${esc(i.map.label||"NAVER 地圖")}</a>`:"";
  const ver=(i.verified||[]).length?`<div class="ver"><div class="vh">查證後的正確資訊</div>${i.verified.map(t=>`<div>${esc(t)}</div>`).join("")}${(i.verifiedSources||[]).length?`<div class="vs">查證來源：${i.verifiedSources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join("、")}</div>`:""}</div>`:"";
  return `<article class="card${imgs.length?" has-img":""}">${pics}<div class="body">
    <div class="top"><div class="title"><h3>${nameHtml}</h3>${i.nameLocal?`<div class="ko">${esc(i.nameLocal)}</div>`:""}</div>
      <button class="status" data-id="${esc(i.id)}" data-s="${esc(st)}" ${canWrite?"":"disabled"} aria-label="狀態：${esc(st)}，點一下切換">${esc(st)}</button></div>
    <div class="meta">${tags.join("")}${mapBtn}</div>
    ${i.summary?`<p class="sum">${esc(i.summary)}</p>`:""}
    ${ver}
    ${(i.phrases||[]).length?`<div class="phr">${i.phrases.map((p,k)=>`${p.group&&(k===0||i.phrases[k-1].group!==p.group)?`<div class="pg">${esc(p.group)}</div>`:""}<div class="pr"><button class="say" data-ko="${esc(p.ko)}" data-audio="${esc(p.audio||"")}" aria-label="播放：${esc(p.ko)}"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button><div class="pt"><div class="pk">${esc(p.ko)}${p.said?`<span class="ps">實際念 [${esc(p.said)}]</span>`:""}</div><div class="pro">${esc(p.roma)}${p.zh?`<span class="pz">≈ ${esc(p.zh)}</span>`:""}</div></div><div class="pm">${esc(p.meaning)}</div></div>`).join("")}<div class="pnote">中文諧音只是近似；按喇叭播放韓語發音音檔，手機靜音時也聽得到（音量要開）。</div></div>`:""}
    ${rows.length?`<dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>`:""}
    ${i.pay?`<div class="pay"><span class="pl">付款</span>${[["信用卡",i.pay.card],["WOWPASS",i.pay.wow],["現金",i.pay.cash]].filter(x=>x[1]).map(x=>`<span class="pc" data-v="${esc(x[1])}">${x[0]} ${esc(x[1])}</span>`).join("")}${i.pay.note?`<div class="pn">${esc(i.pay.note)}</div>`:""}</div>`:""}
    ${(i.tips||[]).length?`<div class="warn">${i.tips.map(t=>`<div>${esc(t)}</div>`).join("")}</div>`:""}
    ${i.fit?`<div class="fit"><b>${i.day?esc(i.day)+"：":""}</b>${esc(i.fit)}</div>`:""}
    ${src?`<div class="src">來源：<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.platform)} ${esc(src.author||"")}</a></div>`:""}
  </div></article>`;
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.classList.contains("pic")){openLb(t.dataset.item,+t.dataset.k);return}
  if(t.classList.contains("say")&&t.dataset.audio){try{window.__au&&window.__au.pause();const a=new Audio(t.dataset.audio);window.__au=a;t.classList.add("on");a.onended=a.onerror=()=>t.classList.remove("on");a.play().catch(()=>t.classList.remove("on"));}catch(err){}return}
  if(t.classList.contains("say")){try{const s=window.speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t.dataset.ko);u.lang="ko-KR";u.rate=0.8;
    const v=s.getVoices().find(x=>/^ko/i.test(x.lang));if(v)u.voice=v;t.classList.add("on");u.onend=u.onerror=()=>t.classList.remove("on");s.speak(u);}catch(err){}return}
  if(t.id==="lbclose"){closeLb();return}
  if(t.id==="lbprev"){stepLb(-1);return}
  if(t.id==="lbnext"){stepLb(1);return}
  if(t.classList.contains("trip")){tripId=t.dataset.id;area="全部";cat="全部";saveUI();render();}
  else if(t.dataset.kind==="area"){area=t.dataset.v;render();}
  else if(t.dataset.kind==="cat"){cat=t.dataset.v;render();}
  else if(t.id&&t.id.startsWith("g-")){group=t.id.slice(2);saveUI();render();}
  else if(t.classList.contains("status")&&db&&canWrite){
    const it=items.find(x=>x.id===t.dataset.id); if(!it)return;
    const next=STATUS[(STATUS.indexOf(it.status||"收藏")+1)%STATUS.length];
    t.disabled=true;
    try{await db.collection("items").doc(it.id).update({status:next})}
    catch(err){if(err&&err.code==="invalid_argument"){canWrite=false;render()}}
    finally{t.disabled=!canWrite}
  }
});
let lbItem=null,lbK=0,lbReturn=null;
function showLb(){const imgs=(lbItem.images||[]).filter(x=>x&&x.url);const x=imgs[lbK];
  $("lbimg").src=x.url;$("lbimg").alt=x.caption||lbItem.name;$("lbtitle").textContent=lbItem.name;
  $("lbcap").textContent=x.caption||"";$("lbpos").textContent=`${lbK+1} / ${imgs.length}`;
  $("lbprev").hidden=$("lbnext").hidden=imgs.length<2;}
function openLb(id,k){lbItem=items.find(x=>x.id===id);if(!lbItem)return;lbK=k||0;lbReturn=document.activeElement;showLb();$("lb").hidden=false;$("lbclose").focus();}
function closeLb(){$("lb").hidden=true;$("lbimg").removeAttribute("src");lbReturn&&lbReturn.focus&&lbReturn.focus();}
function stepLb(d){const n=(lbItem.images||[]).filter(x=>x&&x.url).length;lbK=(lbK+d+n)%n;showLb();}
document.addEventListener("keydown",e=>{if($("lb").hidden)return;if(e.key==="Escape")closeLb();else if(e.key==="ArrowRight")stepLb(1);else if(e.key==="ArrowLeft")stepLb(-1);});
$("lb").addEventListener("click",e=>{if(e.target.id==="lb"||e.target.classList.contains("stage"))closeLb();});
let qt;$("q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{q=e.target.value;render()},120)});

const SNAP=JSON.parse(document.getElementById("snap").textContent);
trips=SNAP.trips.sort((a,b)=>(b.start||"").localeCompare(a.start||""));sources=SNAP.sources.sort((a,b)=>(b.addedAt||"").localeCompare(a.addedAt||""));items=SNAP.items;
let ST={};try{ST=JSON.parse(localStorage.getItem("saves-status")||"{}")}catch(e){}
items.forEach(it=>{if(ST[it.id])it.status=ST[it.id]});
db={collection:()=>({doc:id=>({update:async o=>{const it=items.find(x=>x.id===id);it.status=o.status;ST[id]=o.status;try{localStorage.setItem("saves-status",JSON.stringify(ST))}catch(e){};render()}})})};
render();
</script>
</body></html>
